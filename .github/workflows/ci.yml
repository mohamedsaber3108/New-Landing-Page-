name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: install, lint, types, tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22.13.0
          cache: npm
      - name: Install
        run: npm ci
      # Blocking since prompt 002: lint errors fail CI (warnings do not).
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npx tsc --noEmit
      - name: Tests (vitest, fake DB, not D1)
        run: npm test -- --reporter=verbose
      - name: Build
        run: npm run build

  secret-scan:
    name: secret scan (blocking)
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-scan:
    name: dependency scan (blocking)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22.13.0
          cache: npm
      - name: npm audit (production deps, high and above)
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: e2e workflows (blocking)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Install e2e tooling (not saved to package.json)
        run: npm install --no-save --no-audit --no-fund @playwright/test@1.52.0 @axe-core/playwright@4.10.2
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Test D1 (all migrations, fresh local state)
        run: node scripts/e2e-migrate.mjs
      - name: CI-only admin token (random per run, masked, never committed)
        run: |
          token="$(openssl rand -hex 32)"
          echo "::add-mask::$token"
          printf 'USAM_ADMIN_TOKEN=%s\n' "$token" > .dev.vars
          echo "E2E_ADMIN_TOKEN=$token" >> "$GITHUB_ENV"
      - name: Start server (npm start = wrangler dev --local, as in production)
        run: |
          npm start -- --port 3000 > server.log 2>&1 &
          npx --yes wait-on@8.0.3 http://127.0.0.1:3000 --timeout 90000
      - name: e2e workflows
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
        run: npx playwright test --config e2e/playwright.config.mjs
      - name: Server log on failure
        if: failure()
        run: tail -n 200 server.log
      - name: Remove CI token file
        if: always()
        run: rm -f .dev.vars dist/server/.dev.vars

  axe:
    name: axe accessibility (report-only)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Install axe tooling (not saved to package.json)
        run: npm install --no-save --no-audit --no-fund playwright@1.52.0 @axe-core/playwright@4.10.2
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start server
        run: |
          npx vinext start --port 3000 > server.log 2>&1 &
          npx --yes wait-on@8.0.3 http://127.0.0.1:3000 --timeout 60000
      # REPORT-ONLY until prompt 002 passes. Remove AXE_REPORT_ONLY to make it blocking.
      - name: axe (EN and AR)
        env:
          AXE_REPORT_ONLY: "1"
        run: node scripts/axe-ci.mjs
