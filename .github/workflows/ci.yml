name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: install, lint, types, tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22.13.0
          cache: npm
      - name: Install
        run: npm ci
      # REPORT-ONLY until prompt 002 clears existing findings (8 lint errors, 6 tsc errors).
      - name: Lint (report-only)
        continue-on-error: true
        run: npm run lint
      - name: Type check (report-only)
        continue-on-error: true
        run: npx tsc --noEmit
      - name: Tests (vitest, fake DB, not D1)
        run: npm test -- --reporter=verbose
      - name: Build
        run: npm run build

  secret-scan:
    name: secret scan (blocking)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-scan:
    name: dependency scan (blocking)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22.13.0
          cache: npm
      - name: npm audit (production deps, high and above)
        run: npm audit --omit=dev --audit-level=high

  axe:
    name: axe accessibility (report-only)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Install axe tooling (not saved to package.json)
        run: npm install --no-save --no-audit --no-fund playwright@1.52.0 @axe-core/playwright@4.10.2
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start server
        run: |
          npx vinext start --port 3000 > server.log 2>&1 &
          npx --yes wait-on@8.0.3 http://127.0.0.1:3000 --timeout 60000
      # REPORT-ONLY until prompt 002 passes. Remove AXE_REPORT_ONLY to make it blocking.
      - name: axe (EN and AR)
        env:
          AXE_REPORT_ONLY: "1"
        run: node scripts/axe-ci.mjs
